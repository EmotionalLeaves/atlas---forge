name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # ---- map data: every admin level worldwide + US tracts/block groups (built here, cached) ----
      - name: Restore map data
        id: lvcache
        uses: actions/cache/restore@v4
        with:
          path: app/src/main/assets/www/levels
          key: levels-v2-${{ hashFiles('tools/build-levels.mjs', 'tools/build-data.mjs', 'tools/build-us.mjs', 'tools/lib-shp.mjs', 'tools/gb-list.txt', 'tools/gb-meta.json', 'tools/ci-levels.sh', 'tools/ci-us.sh', 'tools/compact-packs.mjs') }}

      - name: Restore raw downloads
        if: steps.lvcache.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: ~/afraw
          key: raw-v1-${{ hashFiles('tools/gb-list.txt') }}-${{ github.run_number }}
          restore-keys: raw-v1-

      - name: Build admin levels
        if: steps.lvcache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          bash tools/ci-levels.sh 2>&1 | tee data.log

      - name: Build US tracts and block groups
        id: us
        if: steps.lvcache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          set -o pipefail
          bash tools/ci-us.sh 2>&1 | tee -a data.log

      - name: Compact map data
        if: steps.lvcache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          node --max-old-space-size=8000 tools/compact-packs.mjs --afz app/src/main/assets/www/levels 2>&1 | tee -a data.log

      - name: Save map data
        if: steps.lvcache.outputs.cache-hit != 'true' && steps.us.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: app/src/main/assets/www/levels
          key: ${{ steps.lvcache.outputs.cache-primary-key }}

      # ---- precinct-level election results (VEST every statewide race 2016+, NYT 2024), added to the US map data ----
      - name: Restore precinct results
        id: preccache
        uses: actions/cache/restore@v4
        with:
          path: ~/afraw/prec
          key: prec-v1-${{ hashFiles('tools/fetch-precincts.mjs') }}

      - name: Download precinct results
        if: steps.preccache.outputs.cache-hit != 'true'
        run: |
          set -o pipefail
          node --max-old-space-size=8000 tools/fetch-precincts.mjs ~/afraw/prec ~/afraw/prectmp 2>&1 | tee -a data.log
          rm -rf ~/afraw/prectmp

      - name: Save precinct results
        if: steps.preccache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/afraw/prec
          key: ${{ steps.preccache.outputs.cache-primary-key }}

      - name: Add precinct results to the maps
        run: |
          set -o pipefail
          node --max-old-space-size=8000 tools/add-precinct-votes.mjs ~/afraw/prec app/src/main/assets/www/levels app/src/main/assets/www/packs 2>&1 | tail -n 400 | tee -a data.log

      - name: Map data summary
        run: |
          echo "levels: $(ls app/src/main/assets/www/levels | wc -l) files, $(du -sh app/src/main/assets/www/levels | cut -f1)" | tee -a data.log
          df -h . | tee -a data.log

      - name: Build release APK
        run: |
          chmod +x gradlew
          set -o pipefail
          echo "ANDROID_HOME=$ANDROID_HOME" | tee build.log
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          ./gradlew --no-daemon --stacktrace assembleRelease 2>&1 | tee -a build.log

      - name: Name the APK
        run: cp app/build/outputs/apk/release/app-release.apk "AtlasForge-v1.0.${{ github.run_number }}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: AtlasForge-v1.0.${{ github.run_number }}
          path: AtlasForge-*.apk

      # the same web app and map data, handed to the Windows build below
      - name: Hand the app to the Windows build
        uses: actions/upload-artifact@v4
        with:
          name: www
          path: app/src/main/assets/www
          retention-days: 1
          compression-level: 1

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Atlas Forge v1.0.${{ github.run_number }}
          body: |
            **Android:** download the APK below and open it on your phone to install (allow installs from your browser/files app if asked). It installs over earlier versions and keeps your saved maps.
            **Windows:** download AtlasForge-Setup (installer) or AtlasForge-Windows (zip, no install) below; the Windows files appear a few minutes after the APK.
          files: AtlasForge-*.apk
          make_latest: true

      - name: Keep the build log on the ci-log branch
        if: always()
        run: |
          mkdir -p /tmp/ci && (cp build.log /tmp/ci/build.log 2>/dev/null || echo "no build log" > /tmp/ci/build.log)
          cp data.log /tmp/ci/data.log 2>/dev/null || echo "map data came from cache" > /tmp/ci/data.log
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > /tmp/ci/status.txt
          tail -n 120 /tmp/ci/build.log > /tmp/ci/tail.txt
          cd /tmp/ci && git init -q && git checkout -q -b ci-log
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "build log ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log

  windows:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Get the app and map data
        uses: actions/download-artifact@v4
        with:
          name: www
          path: desktop/www

      - name: Build the Windows app
        working-directory: desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          set -o pipefail
          npm version 1.0.${{ github.run_number }} --no-git-tag-version --allow-same-version 2>&1 | tee build-win.log
          npm install --no-audit --no-fund 2>&1 | tee -a build-win.log
          npx electron-builder --win --x64 --publish never 2>&1 | tee -a build-win.log
          ls -la dist | tee -a build-win.log

      - name: Start the app once
        continue-on-error: true
        working-directory: desktop
        shell: bash
        run: |
          "./dist/win-unpacked/Atlas Forge.exe" --smoke || echo "app exited with $?"
          cat smoke.txt | tee -a build-win.log
          grep -q '"ok": true' smoke.txt

      - name: Attach to the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          files: |
            desktop/dist/AtlasForge-Setup-*.exe
            desktop/dist/AtlasForge-Windows-*.zip

      - name: Keep the Windows build log on the ci-log-win branch
        if: always()
        shell: bash
        run: |
          mkdir -p /tmp/ciw && (cp desktop/build-win.log /tmp/ciw/build-win.log 2>/dev/null || echo "no log" > /tmp/ciw/build-win.log)
          echo "${{ job.status }} run=${{ github.run_number }}" > /tmp/ciw/status.txt
          cd /tmp/ciw && git init -q && git checkout -q -b ci-log-win
          git config user.name "ci" && git config user.email "ci@users.noreply.github.com"
          git add . && git commit -qm "windows log ${{ github.run_number }}"
          git push -q -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" ci-log-win
