<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#0e131b">
<title>Atlas Forge</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body data-mode="explore">
<div id="app">
  <div id="map"><div id="tilesBase" class="tiles"></div><canvas id="gl"></canvas><div id="tilesLabels" class="tiles"></div><canvas id="labels"></canvas></div>
  <div id="attr"></div>
  <div id="mapLegend" hidden></div>
  <header id="top">
    <button id="menuBtn" class="round" aria-label="Menu"></button>
    <div class="title"><b>Atlas Forge</b><span id="date"></span></div>
    <button id="themeBtn" class="themechip" aria-label="Choose map"></button>
  </header>
  <div id="floating"></div>
  <section id="sheet"><div class="grab"><i></i></div><div id="sheetBody"></div></section>
  <nav id="tabs"></nav>
  <div id="modal" class="hidden" onclick="if(event.target===this)this.classList.add('hidden')"><div class="modal-card"></div></div>
  <div id="toast"></div>
  <div id="loading">
    <div class="logo"><svg viewBox="0 0 64 64"><circle cx="32" cy="32" r="26"/><path d="M6 32h52M32 6c9 8 9 44 0 52M32 6c-9 8-9 44 0 52M11 18h42M11 46h42"/></svg><b>Atlas Forge</b></div>
    <div class="bar"><i></i></div><div class="msg">Loading…</div>
  </div>
</div>
<script type="module" src="js/app.js"></script>
</body>
</html>
